<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaw</title>
  <style>
    :root{--bg:#050505;--card:#121212;--soft:#1d1d1d;--border:#333;--text:#fff;--muted:#aaa;--green:#46e17d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#202020,#050505 55%);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{max-width:460px;margin:0 auto;min-height:100vh;padding:22px 18px 96px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo{width:46px;height:46px;border-radius:14px;background:#050505}.brand-name{font-size:28px;font-weight:900}.title{font-size:42px;line-height:1;font-weight:900;margin:14px 0 8px}.sub{color:var(--muted);font-size:16px;line-height:1.35}.card{background:rgba(18,18,18,.96);border:1px solid var(--border);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 16px 40px rgba(0,0,0,.32)}.label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}.value{font-size:34px;font-weight:900}.muted{color:var(--muted)}.green{color:var(--green)}.btn{width:100%;border:0;border-radius:18px;background:var(--green);color:#050505;font-weight:900;font-size:17px;padding:16px;margin-top:12px}.btn-dark{background:#090909;color:#fff;border:1px solid var(--border)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(15,15,15,.98);border-top:1px solid #333;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px 18px}.tab{background:transparent;border:0;color:#aaa;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.tab b{font-size:20px}.tab.active{color:#fff}.set{display:grid;grid-template-columns:38px 1fr 1fr 46px;gap:8px;align-items:center;margin:9px 0}.cell{background:#090909;border:1px solid #333;border-radius:12px;padding:11px;text-align:center;color:#fff;width:100%}input.cell{font-size:16px}.pill{display:inline-block;border:1px solid #333;border-radius:999px;padding:7px 12px;margin:4px 6px 4px 0;color:#ddd}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero .mascot{font-size:74px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}.hidden{display:none}.meal{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center}.food{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#eee,#777);display:flex;align-items:center;justify-content:center;font-size:30px}.progressbar{height:12px;background:#2b2b2b;border-radius:99px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--green);width:45%}svg{display:block}h2,h3,p{margin-top:8px}</style>
</head>
<body>
  <main class="app">
    <div class="brand"><div class="logo" id="logo"></div><div class="brand-name">Galaw</div></div>
    <section id="home"></section>
    <section id="workout" class="hidden"></section>
    <section id="active" class="hidden"></section>
    <section id="exercises" class="hidden"></section>
    <section id="progress" class="hidden"></section>
    <section id="nutrition" class="hidden"></section>
  </main>
  <nav class="tabs">
    <button class="tab active" data-page="home"><b>⌂</b>Home</button>
    <button class="tab" data-page="workout"><b>🏋</b>Workout</button>
    <button class="tab" data-page="exercises"><b>▦</b>Exercises</button>
    <button class="tab" data-page="progress"><b>▥</b>Progress</button>
    <button class="tab" data-page="nutrition"><b>🍎</b>Nutrition</button>
  </nav>
<script>
const logoSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#050505"/><circle cx="50" cy="50" r="33" fill="#222" stroke="#fff" stroke-width="4"/><path d="M28 35C12 18 17 8 35 28M72 35C88 18 83 8 65 28" fill="none" stroke="#eee" stroke-width="7" stroke-linecap="round"/><ellipse cx="50" cy="56" rx="19" ry="14" fill="#ddd"/><circle cx="42" cy="46" r="4" fill="#fff"/><path d="M58 45q8-4 13 3" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M39 64q11 9 23 0" stroke="#050505" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M25 76l-10 10" stroke="#46e17d" stroke-width="8" stroke-linecap="round"/></svg>`;document.getElementById('logo').innerHTML=logoSvg;
const routines=[{id:'push',name:'Push Day',desc:'Chest, Shoulders, Triceps',mins:45,ex:['Bench Press','Overhead Press','Tricep Pushdown']},{id:'pull',name:'Pull Day',desc:'Back and Biceps',mins:45,ex:['Barbell Row','Bicep Curl']},{id:'leg',name:'Leg Day',desc:'Quads, Hamstrings, Glutes',mins:50,ex:['Squat','Lunges','Calf Raise']}];
const guides={
 'Bench Press':{muscle:'Chest',equipment:'Barbell',steps:['Lie flat on the bench with eyes under the bar.','Grip slightly wider than shoulder width.','Lower the bar slowly to mid-chest.','Press upward with control.'],mistakes:['Bouncing the bar','Flaring elbows too wide','Using too much weight'],tip:'Keep feet planted and use a spotter when lifting heavy.'},
 'Overhead Press':{muscle:'Shoulders',equipment:'Barbell',steps:['Stand tall with bar at shoulder level.','Keep core tight.','Press overhead with control.','Lower slowly.'],mistakes:['Leaning too far back','Using momentum'],tip:'Avoid over-arching your lower back.'},
 'Tricep Pushdown':{muscle:'Triceps',equipment:'Cable',steps:['Face the cable machine.','Keep elbows close.','Push handle down until arms extend.','Return slowly.'],mistakes:['Moving elbows forward','Swinging body'],tip:'Use a weight you can control.'},
 'Barbell Row':{muscle:'Back',equipment:'Barbell',steps:['Hinge at hips.','Keep spine neutral.','Pull bar to lower ribs.','Lower with control.'],mistakes:['Rounding back','Jerking the bar'],tip:'Keep your back stable.'},
 'Squat':{muscle:'Legs',equipment:'Barbell',steps:['Place bar securely.','Feet shoulder width.','Lower hips with chest up.','Stand with control.'],mistakes:['Knees collapsing','Heels lifting'],tip:'Start light and focus on form.'}
};
let state=JSON.parse(localStorage.getItem('galaw_state')||'{"sessions":[]}');let active=null;
function save(){localStorage.setItem('galaw_state',JSON.stringify(state))}
function totalVolume(s){return s.exercises.reduce((a,e)=>a+e.sets.reduce((x,t)=>x+(+t.kg*+t.reps),0),0)}function totalSets(s){return s.exercises.reduce((a,e)=>a+e.sets.length,0)}
function show(page){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));render(page)}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.page));
function render(page){({home,workout,exercises,progress,nutrition}[page]||home)()}
function home(){let done=state.sessions.filter(s=>s.done);let vol=done.reduce((a,s)=>a+totalVolume(s),0);document.getElementById('home').innerHTML=`<div class="hero"><div><div class="title">Good morning!</div><div class="sub">Same discipline. Stronger you.</div></div><div class="mascot">🐃</div></div><div class="card"><div class="label">Today's Routine</div><div class="value">Push Day</div><p class="muted">6 exercises • ~45 min • Chest, Shoulders, Triceps</p><button class="btn" onclick="startWorkout('push')">▶ Start Workout</button></div><div class="grid"><div class="card"><div class="label">Volume</div><div class="value">${vol}</div><div class="muted">KG</div></div><div class="card"><div class="label">Workouts</div><div class="value">${done.length}</div><div class="muted">Done</div></div><div class="card"><div class="label">Sets</div><div class="value">${done.reduce((a,s)=>a+totalSets(s),0)}</div><div class="muted">Total</div></div></div>`}
function workout(){document.getElementById('workout').innerHTML=`<div class="title">Routines</div><div class="sub">Build consistency with reusable workouts.</div>`+routines.map(r=>`<div class="card"><div class="label">Workout Routine</div><div class="value">${r.name}</div><p class="muted">${r.desc}</p><p>${r.ex.length} exercises • ~${r.mins} min</p><button class="btn" onclick="startWorkout('${r.id}')">Start</button></div>`).join('')}
function startWorkout(id){let r=routines.find(x=>x.id===id);active={id:Date.now(),name:r.name,started:new Date().toISOString(),done:false,exercises:r.ex.map(n=>({name:n,sets:[]}))};state.sessions.push(active);save();show('active')}
function activeScreen(){if(!active)active=state.sessions.find(s=>!s.done)||state.sessions[state.sessions.length-1];if(!active){startWorkout('push');return}document.getElementById('active').innerHTML=`<div class="card"><div class="label">Active Workout</div><div class="title">${active.name}</div><div class="sub">Log sets, reps, and weight.</div><div class="progressbar"><span style="width:${Math.min(100,totalSets(active)*12)}%"></span></div></div>`+active.exercises.map((e,i)=>`<div class="card"><div class="label">${guides[e.name]?.muscle||'Workout'} • ${guides[e.name]?.equipment||'Equipment'}</div><h2>${i+1}. ${e.name}</h2>${e.sets.map((s,idx)=>`<div class="set"><div class="cell">${idx+1}</div><div class="cell">${s.kg} KG</div><div class="cell">${s.reps}</div><div class="cell green">✓</div></div>`).join('')}<div class="set"><div class="cell">${e.sets.length+1}</div><input id="kg-${i}" class="cell" type="number" placeholder="KG" value="${e.sets.at(-1)?.kg||40}"><input id="reps-${i}" class="cell" type="number" placeholder="Reps" value="10"><button class="btn" onclick="addSet(${i})">✓</button></div></div>`).join('')+`<button class="btn" onclick="finishWorkout()">⚑ Finish Workout</button>`}function active(){activeScreen()}
function addSet(i){let kg=document.getElementById('kg-'+i).value||0;let reps=document.getElementById('reps-'+i).value||0;active.exercises[i].sets.push({kg,reps});save();activeScreen()}function finishWorkout(){active.done=true;active.ended=new Date().toISOString();save();active=null;show('progress')}
function exercises(){let keys=Object.keys(guides);document.getElementById('exercises').innerHTML=`<div class="title">Exercise Guide</div><div class="sub">Learn proper form. Train smarter.</div>`+keys.map(k=>{let g=guides[k];return `<div class="card"><div class="label">${g.muscle} • ${g.equipment}</div><div class="value">${k}</div><h3>How to do it</h3><ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h3>Common mistakes</h3><ul>${g.mistakes.map(s=>`<li>${s}</li>`).join('')}</ul><p class="green"><b>Safety:</b> ${g.tip}</p></div>`}).join('')}
function progress(){let done=state.sessions.filter(s=>s.done);document.getElementById('progress').innerHTML=`<div class="title">Progress</div><div class="sub">Track your consistency. See your gains.</div><div class="grid"><div class="card"><div class="label">Workouts</div><div class="value">${done.length}</div></div><div class="card"><div class="label">Sets</div><div class="value">${done.reduce((a,s)=>a+totalSets(s),0)}</div></div><div class="card"><div class="label">Volume</div><div class="value">${done.reduce((a,s)=>a+totalVolume(s),0)}</div></div></div><div class="card"><div class="label">Recent Sessions</div>${done.length?done.slice(-5).reverse().map(s=>`<h2>${s.name}</h2><p class="muted">${totalSets(s)} sets • ${totalVolume(s)} KG</p>`).join(''):'<p class="muted">No completed sessions yet.</p>'}</div>`}
function nutrition(){document.getElementById('nutrition').innerHTML=`<div class="title">Nutrition</div><div class="sub">Fuel your goals. Values are estimates.</div><div class="card"><div class="label">Today</div><div class="value">1,480</div><p class="muted">/ 2,200 kcal estimated</p><div class="grid"><div><b>138g</b><br><span class="muted">Protein</span></div><div><b>165g</b><br><span class="muted">Carbs</span></div><div><b>42g</b><br><span class="muted">Fats</span></div></div><button class="btn">Scan Food</button><button class="btn btn-dark">Add Meal</button></div><div class="card meal"><div class="food">🥣</div><div><h3>Breakfast</h3><p class="muted">Oatmeal with banana • 320 kcal</p></div></div><div class="card meal"><div class="food">🍗</div><div><h3>Lunch</h3><p class="muted">Chicken, rice, broccoli • 680 kcal</p></div></div>`}
render('home');
</script>
</body>
</html>
