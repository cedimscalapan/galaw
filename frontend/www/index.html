<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaw</title>
  <style>
    :root{--bg:#050505;--card:#151515;--card2:#202020;--line:#343434;--text:#fff;--muted:#a8a8a8;--green:#46e17d;--danger:#ff6060;--yellow:#ffd85a}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 0,rgba(255,255,255,.13),transparent 18%),radial-gradient(circle at 5% 8%,rgba(70,225,125,.10),transparent 18%),linear-gradient(180deg,#141414 0%,#080808 46%,#020202 100%);z-index:-2}body:after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px);background-size:92px 92px;opacity:.55;z-index:-1}.app{width:100%;max-width:520px;min-height:100vh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px 112px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:15px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.4)}.brand-name{font-size:31px;font-weight:950;letter-spacing:-1px}.icon-row{display:flex;gap:9px}.icon-btn{width:43px;height:43px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;font-size:17px}.page{display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:1fr 122px;gap:8px;align-items:center;min-height:150px;margin-bottom:10px}.hero.big{grid-template-columns:1fr 132px}.mascot{width:122px;height:122px;filter:drop-shadow(0 20px 25px rgba(0,0,0,.7));opacity:.98}.kicker{font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:900}.title{font-size:46px;line-height:.96;font-weight:950;letter-spacing:-2px;margin:8px 0 9px}.sub{color:#d6d6d6;font-size:17px;line-height:1.35}.card{background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(10,10,10,.98));border:1px solid rgba(255,255,255,.12);border-radius:25px;padding:18px;margin:13px 0;box-shadow:0 22px 55px rgba(0,0,0,.34);overflow:hidden}.card.flat{box-shadow:none;background:rgba(20,20,20,.92)}.label{font-size:12px;text-transform:uppercase;letter-spacing:2.2px;color:var(--muted);font-weight:900}.value{font-size:39px;font-weight:950;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:13px}.green{color:var(--green)}.danger{color:var(--danger)}.btn{width:100%;border:0;border-radius:19px;background:linear-gradient(135deg,#fff,#e7e7e7);color:#050505;font-size:18px;font-weight:950;padding:16px 18px;margin-top:13px;box-shadow:0 14px 34px rgba(0,0,0,.35)}.btn.green-bg{background:linear-gradient(135deg,#5af08e,#25d96a)}.btn.dark{background:#090909;color:#fff;border:1px solid rgba(255,255,255,.16)}.btn.danger-bg{background:linear-gradient(135deg,#ff7575,#ff4f4f);color:#070707}.btn.inline{width:auto;margin:0;padding:12px 16px;font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{min-height:116px;padding:15px 12px}.stat .value{font-size:31px}.routine-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.mini{min-height:77px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(255,255,255,.04);padding:10px 6px;text-align:center;font-size:12px}.mini b{font-size:21px;display:block;margin-bottom:5px}.chart{height:115px;display:flex;gap:12px;align-items:flex-end;margin-top:18px}.bar{flex:1;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#fff,#696969);position:relative;min-height:8px}.bar.greenbar{background:linear-gradient(180deg,#62ee90,#1a8e4a)}.bar span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px}.chipbar{display:flex;gap:9px;overflow-x:auto;padding:2px 0 9px}.chip{border:0;border-radius:17px;padding:12px 19px;background:rgba(255,255,255,.08);color:#bdbdbd;font-weight:900;white-space:nowrap}.chip.active{background:#fff;color:#050505}.routine-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}.thumb{height:88px;border-radius:18px;background:linear-gradient(135deg,#202020,#070707);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:39px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.quick{display:flex;gap:15px;flex-wrap:wrap;color:#e5e5e5;font-size:13px;margin:10px 0}.progress-line{height:17px;background:#2a2a2a;border-radius:99px;overflow:hidden;margin-top:13px}.progress-line span{height:100%;background:linear-gradient(90deg,#46e17d,#7bffad);display:block;border-radius:99px;transition:.25s}.exercise-card.current{border-color:rgba(70,225,125,.45);box-shadow:0 0 0 1px rgba(70,225,125,.15),0 22px 55px rgba(0,0,0,.34)}.exercise-head{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center}.set-head,.set-row{display:grid;grid-template-columns:42px 1fr 80px 54px;gap:8px;align-items:center}.set-head{color:#aaa;text-transform:uppercase;font-size:11px;letter-spacing:1.5px;margin:15px 0 7px}.cell{background:#090909;border:1px solid #393939;border-radius:13px;padding:13px 9px;text-align:center;color:#fff;width:100%;font-size:16px;min-width:0}.cell.invalid{border-color:var(--danger);box-shadow:0 0 0 1px rgba(255,96,96,.35)}.check{background:var(--green);color:#020202;border:0;border-radius:50%;width:45px;height:45px;font-size:22px;font-weight:950}.ghost-check{background:transparent;border:2px solid #666;color:transparent}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.field label{display:block;color:#aaa;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px;font-weight:900}.field input,.field select,.field textarea{width:100%;background:#090909;color:#fff;border:1px solid #383838;border-radius:14px;padding:14px;font-size:16px;outline:none}.field textarea{resize:vertical;min-height:76px}.error{display:none;color:var(--danger);font-size:12px;margin-top:5px}.error.show{display:block}.rest{display:grid;grid-template-columns:100px 1fr;gap:15px;align-items:center}.ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--green) 68%,#333 0);display:grid;place-items:center}.ring:after{content:"";width:61px;height:61px;border-radius:50%;background:#111;display:block}.timer{font-size:36px;font-weight:950}.guide-card h3{margin:14px 0 8px}.guide-card li{margin:7px 0;color:#dedede}.meal{display:grid;grid-template-columns:70px 1fr auto;gap:13px;align-items:center}.food{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#eee,#777);display:grid;place-items:center;font-size:32px}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.macro-box{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:13px 6px;background:rgba(255,255,255,.04)}.share-card{background:radial-gradient(circle at top right,rgba(70,225,125,.18),transparent 28%),linear-gradient(145deg,#1d1d1d,#080808);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:20px}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:99px;font-weight:900}.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#050505;border-radius:16px;padding:12px 15px;font-weight:900;z-index:40;max-width:calc(100% - 34px);transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(14,14,14,.98);border-top:1px solid rgba(255,255,255,.10);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(env(safe-area-inset-bottom) + 14px);z-index:20;backdrop-filter:blur(18px)}.tab{background:transparent;border:0;color:#aaa;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:22px}.tab b{font-size:22px;line-height:1}.tab.active{color:#fff;background:rgba(255,255,255,.08)}@media(max-width:390px){.title{font-size:40px}.hero{grid-template-columns:1fr 96px;min-height:128px}.hero.big{grid-template-columns:1fr 102px}.mascot{width:96px;height:96px}.stats{grid-template-columns:1fr 1fr}.routine-card{grid-template-columns:82px 1fr}.thumb{height:78px}.set-head,.set-row{grid-template-columns:34px 1fr 64px 46px}.cell{padding:11px 6px}.routine-mini{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar"><div class="brand"><div class="logo" id="logo"></div><div class="brand-name">Galaw</div></div><div class="icon-row"><button class="icon-btn" id="resetBtn" title="Reset demo data">↻</button><button class="icon-btn">🔔</button></div></div>
    <section id="home" class="page active"></section>
    <section id="workout" class="page"></section>
    <section id="activeWorkout" class="page"></section>
    <section id="exercises" class="page"></section>
    <section id="progress" class="page"></section>
    <section id="nutrition" class="page"></section>
    <section id="share" class="page"></section>
  </main>
  <nav class="tabs">
    <button class="tab active" data-page="home"><b>⌂</b>Home</button>
    <button class="tab" data-page="workout"><b>🏋</b>Workout</button>
    <button class="tab" data-page="exercises"><b>▦</b>Exercises</button>
    <button class="tab" data-page="progress"><b>▥</b>Progress</button>
    <button class="tab" data-page="nutrition"><b>🍎</b>Nutrition</button>
  </nav>
  <div id="toast" class="toast"></div>
<script>
const mascotSvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="#050505"/><path d="M31 39C14 20 20 9 43 31M89 39c17-19 11-30-12-8" fill="none" stroke="#ddd" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="61" r="35" fill="#1d1d1d" stroke="#eee" stroke-width="4"/><ellipse cx="60" cy="70" rx="22" ry="15" fill="#d9d9d9"/><circle cx="48" cy="55" r="5" fill="#fff"/><path d="M70 54q10-5 18 4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M46 76q13 11 29 0" stroke="#050505" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M26 91l-12 12" stroke="#46e17d" stroke-width="10" stroke-linecap="round"/></svg>';
const mascotLarge='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260"><path d="M65 76C18 20 33-1 92 57M195 76c47-56 32-77-27-19" fill="none" stroke="#ddd" stroke-width="18" stroke-linecap="round"/><circle cx="130" cy="125" r="74" fill="#1b1b1b" stroke="#f1f1f1" stroke-width="8"/><ellipse cx="130" cy="146" rx="45" ry="30" fill="#d9d9d9"/><circle cx="106" cy="111" r="10" fill="#fff"/><path d="M148 106q23-12 42 10" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M101 159q30 24 62 0" stroke="#050505" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M48 196l-26 26" stroke="#46e17d" stroke-width="18" stroke-linecap="round"/><path d="M182 178q35 9 49 44" stroke="#f5f5f5" stroke-width="18" fill="none" stroke-linecap="round"/></svg>';
document.getElementById('logo').innerHTML=mascotSvg;
const guide={
 'Bench Press':{muscle:'Chest',equipment:'Barbell',emoji:'🏋️',steps:['Lie flat on the bench and plant your feet.','Grip the bar slightly wider than shoulder width.','Lower the bar with control to mid-chest.','Press up without bouncing the bar.'],mistakes:['Bouncing the bar','Flaring elbows too wide','Using weight you cannot control'],tip:'Use a spotter when lifting heavy.'},
 'Overhead Press':{muscle:'Shoulders',equipment:'Barbell',emoji:'💪',steps:['Start with the bar at shoulder level.','Brace your core and keep ribs down.','Press overhead in a straight path.','Lower slowly back to shoulders.'],mistakes:['Leaning too far backward','Using momentum','Locking the back awkwardly'],tip:'Keep core tight and use controlled reps.'},
 'Tricep Pushdown':{muscle:'Triceps',equipment:'Cable',emoji:'🪢',steps:['Stand facing the cable machine.','Keep elbows close to your body.','Push down until arms extend.','Return slowly without moving elbows.'],mistakes:['Swinging the body','Moving elbows forward','Rushing the movement'],tip:'Choose a weight you can control.'},
 'Incline Press':{muscle:'Chest',equipment:'Dumbbell',emoji:'📐',steps:['Set bench to a low incline.','Keep shoulders stable.','Press dumbbells upward.','Lower with control.'],mistakes:['Too steep bench angle','Bouncing reps'],tip:'Keep wrists stacked over elbows.'},
 'Lateral Raise':{muscle:'Shoulders',equipment:'Dumbbell',emoji:'🪽',steps:['Stand tall with light dumbbells.','Raise arms to shoulder height.','Pause briefly.','Lower slowly.'],mistakes:['Using heavy weight','Swinging the body'],tip:'Use light weight and strict form.'},
 'Push-up':{muscle:'Chest',equipment:'Bodyweight',emoji:'⬆️',steps:['Place hands under shoulders.','Keep body straight.','Lower chest toward floor.','Push back up.'],mistakes:['Sagging hips','Half reps'],tip:'Modify on knees if needed.'},
 'Barbell Row':{muscle:'Back',equipment:'Barbell',emoji:'🚣',steps:['Hinge at the hips.','Keep spine neutral.','Pull bar toward lower ribs.','Lower with control.'],mistakes:['Rounding lower back','Jerking the bar'],tip:'Keep your back stable.'},
 'Assisted Pull-up':{muscle:'Back',equipment:'Machine',emoji:'⬆️',steps:['Set assistance level.','Pull chest toward the bar.','Control the lowering phase.'],mistakes:['Shrugging shoulders','Swinging'],tip:'Start with enough assistance.'},
 'Bicep Curl':{muscle:'Biceps',equipment:'Dumbbell',emoji:'💪',steps:['Keep elbows near your sides.','Curl weight upward.','Squeeze briefly.','Lower slowly.'],mistakes:['Swinging','Moving elbows forward'],tip:'Control the lowering phase.'},
 'Cable Curl':{muscle:'Biceps',equipment:'Cable',emoji:'🪢',steps:['Stand close to the cable.','Keep elbows steady.','Curl with control.','Return slowly.'],mistakes:['Leaning back','Fast reps'],tip:'Keep tension throughout.'},
 'Face Pull':{muscle:'Rear Delts',equipment:'Cable',emoji:'🎯',steps:['Set cable at face height.','Pull rope toward face.','Lead with elbows.','Return slowly.'],mistakes:['Pulling too low','Using heavy weight'],tip:'Focus on shoulder control.'},
 'Lat Pulldown':{muscle:'Back',equipment:'Machine',emoji:'⬇️',steps:['Grip bar slightly wider than shoulders.','Pull bar to upper chest.','Squeeze back.','Return with control.'],mistakes:['Leaning too far back','Pulling behind neck'],tip:'Pull to chest, not behind neck.'},
 'Squat':{muscle:'Legs',equipment:'Barbell',emoji:'🦵',steps:['Stand with feet shoulder-width.','Brace core.','Lower hips while chest stays up.','Stand with control.'],mistakes:['Knees collapsing','Heels lifting','Rounding back'],tip:'Start light and master depth.'},
 'Leg Press':{muscle:'Legs',equipment:'Machine',emoji:'🦵',steps:['Place feet firmly.','Lower platform with control.','Press without locking knees.'],mistakes:['Too much range too soon','Locking knees'],tip:'Keep knees aligned with toes.'},
 'Romanian Deadlift':{muscle:'Hamstrings',equipment:'Barbell',emoji:'🔗',steps:['Hold bar in front.','Hinge hips back.','Keep spine neutral.','Return by driving hips forward.'],mistakes:['Rounding back','Squatting instead of hinging'],tip:'Feel stretch in hamstrings.'},
 'Leg Curl':{muscle:'Hamstrings',equipment:'Machine',emoji:'🦵',steps:['Set pad properly.','Curl heels toward glutes.','Pause.','Lower slowly.'],mistakes:['Using momentum','Lifting hips'],tip:'Use slow controlled reps.'},
 'Calf Raise':{muscle:'Calves',equipment:'Machine',emoji:'🦶',steps:['Stand tall.','Raise heels high.','Pause at the top.','Lower fully.'],mistakes:['Bouncing reps','Too short range'],tip:'Use full range of motion.'},
 'Lunge':{muscle:'Legs',equipment:'Bodyweight',emoji:'🚶',steps:['Step forward.','Lower back knee carefully.','Push through front foot.','Return to standing.'],mistakes:['Knee caving inward','Leaning too far forward'],tip:'Start bodyweight first.'}
};
const routines=[
 {id:'push',name:'Push Day',desc:'Chest, Shoulders, Triceps',mins:45,type:'Upper Body',emoji:'🏋️',ex:['Bench Press','Overhead Press','Tricep Pushdown','Incline Press','Lateral Raise','Push-up']},
 {id:'pull',name:'Pull Day',desc:'Back, Biceps',mins:45,type:'Upper Body',emoji:'💪',ex:['Barbell Row','Assisted Pull-up','Bicep Curl','Cable Curl','Face Pull','Lat Pulldown']},
 {id:'leg',name:'Leg Day',desc:'Quads, Hamstrings, Glutes, Calves',mins:50,type:'Lower Body',emoji:'🦵',ex:['Squat','Leg Press','Romanian Deadlift','Leg Curl','Calf Raise','Lunge']},
 {id:'full',name:'Full Body',desc:'Chest, Back, Legs, Shoulders, Arms',mins:60,type:'Full Body',emoji:'⚡',ex:['Squat','Bench Press','Barbell Row','Overhead Press','Bicep Curl','Tricep Pushdown']}
];
const storeKey='galaw_v4';let state=loadState();let currentPage='home';let filter='All';let lastFinished=null;function loadState(){try{const raw=localStorage.getItem(storeKey);if(raw)return JSON.parse(raw)}catch(e){}return {sessions:[],meals:demoMeals(),activeId:null}}function save(){localStorage.setItem(storeKey,JSON.stringify(state))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function today(){return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function activeSession(){return state.sessions.find(s=>s.id===state.activeId&&!s.completed)||null}function sessionVolume(s){return s.exercises.reduce((a,e)=>a+e.sets.reduce((x,t)=>x+(Number(t.kg)*Number(t.reps)),0),0)}function sessionSets(s){return s.exercises.reduce((a,e)=>a+e.sets.length,0)}function completedExerciseCount(s){return s.exercises.filter(e=>e.sets.length>=Math.min(3,e.targetSets)).length}function completedSessions(){return state.sessions.filter(s=>s.completed)}function weeklyVolume(){return completedSessions().reduce((a,s)=>a+sessionVolume(s),0)}function weekWorkouts(){return completedSessions().length}function demoMeals(){return[{name:'Oatmeal with banana',meal:'Breakfast',cal:320,emoji:'🥣'},{name:'Chicken rice bowl',meal:'Lunch',cal:680,emoji:'🍗'}]}function hMascot(){return '<div class="mascot">'+mascotLarge+'</div>'}
function setPage(page){currentPage=page;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));render()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setPage(t.dataset.page));document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all Galaw demo workout data?')){localStorage.removeItem(storeKey);state=loadState();lastFinished=null;toast('Demo data reset.');setPage('home')}};
function render(){if(currentPage==='home')renderHome();if(currentPage==='workout')renderWorkout();if(currentPage==='activeWorkout')renderActive();if(currentPage==='exercises')renderExercises();if(currentPage==='progress')renderProgress();if(currentPage==='nutrition')renderNutrition();if(currentPage==='share')renderShare()}
function renderHome(){const done=completedSessions();const active=activeSession();document.getElementById('home').innerHTML=`<div class="hero big"><div><div class="title">Good morning,<br>Bryl!</div><div class="sub">Same discipline.<br>Stronger you.</div></div>${hMascot()}</div><div class="card"><div class="row"><div><div class="label">Today's Routine</div><div class="value">Push Day</div></div><div class="label">${today()}</div></div><p class="muted">6 exercises • ~45 min • Chest, Shoulders, Triceps</p><div class="routine-mini"><div class="mini"><b>🏋️</b>Bench Press</div><div class="mini"><b>💪</b>Overhead Press</div><div class="mini"><b>🪢</b>Tricep Pushdown</div><div class="mini"><b>+3</b>more</div></div><button class="btn" onclick="${active?'resumeWorkout()':'startWorkout(\'push\')'}">▶ ${active?'Resume Workout':'Start Workout'}</button></div><div class="stats"><div class="card stat"><div class="label">Weekly Volume</div><div class="value">${weeklyVolume()}</div><div class="muted">KG</div><div class="green small">↑ +12% vs. last week</div></div><div class="card stat"><div class="label">Streak</div><div class="value">${done.length?2:0}</div><div class="muted">Weeks</div><div class="green">● ● ● ○ ○</div></div><div class="card stat"><div class="label">This Week</div><div class="value">${weekWorkouts()}/4</div><div class="muted">Workouts</div></div></div><div class="card"><div class="row"><div class="label">Weekly Progress</div><div class="label">Volume (KG)</div></div>${chartHtml()}</div>${active?`<div class="card flat"><div class="label">Active Workout</div><h2>${active.name}</h2><p class="muted">${completedExerciseCount(active)} / ${active.exercises.length} exercises • ${sessionSets(active)} sets logged</p><button class="btn green-bg" onclick="resumeWorkout()">Continue Workout</button></div>`:''}`}
function chartHtml(){const vals=[2900,3400,5800,0,4100,0,0];const days=['MON','TUE','WED','THU','FRI','SAT','SUN'];return `<div class="chart">${vals.map((v,i)=>`<div class="bar ${i===2?'greenbar':''}" style="height:${Math.max(8,v/58)}px"><span>${v?((v/1000).toFixed(1)+'K'):'-'}</span></div>`).join('')}</div><div class="row small muted">${days.map(d=>`<span>${d}</span>`).join('')}</div>`}
function renderWorkout(){const active=activeSession();const list=routines.filter(r=>filter==='All'||r.type===filter);document.getElementById('workout').innerHTML=`<div class="hero"><div><div class="title">Routines</div><div class="sub">Build consistency with reusable workouts.</div></div>${hMascot()}</div><div class="chipbar">${['All','Upper Body','Lower Body','Full Body'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div>${active?`<div class="card flat"><div class="row"><div><div class="label">Workout in Progress</div><h2>${active.name}</h2><p class="muted">Resume or finish your current session first.</p></div><button class="btn inline green-bg" onclick="resumeWorkout()">Resume</button></div></div>`:''}${list.map(r=>`<div class="card routine-card"><div class="thumb">${r.emoji}</div><div><div class="row"><h2>${r.name}</h2><span class="muted">⋮</span></div><p class="muted">${r.desc}</p><div class="quick"><span>🏋 ${r.ex.length} exercises</span><span>◷ ~${r.mins} min</span></div><button class="btn inline green-bg" onclick="startWorkout('${r.id}')">▶ Start</button></div></div>`).join('')}`}
function setFilter(f){filter=f;renderWorkout()}function resumeWorkout(){if(activeSession()){setPage('activeWorkout')}else{toast('No active workout. Start a routine first.');setPage('workout')}}
function startWorkout(rid){const existing=activeSession();if(existing){if(confirm('You already have an active workout. Resume it instead?')){resumeWorkout();return}else{state.activeId=null}}const r=routines.find(x=>x.id===rid);const session={id:uid(),routineId:r.id,name:r.name,desc:r.desc,startedAt:new Date().toISOString(),completed:false,notes:'',exercises:r.ex.map((n,i)=>({name:n,muscle:guide[n]?.muscle||'Workout',equipment:guide[n]?.equipment||'Equipment',emoji:guide[n]?.emoji||'🏋️',targetSets:3,targetReps:i===2?12:10,targetKg:guide[n]?.equipment==='Bodyweight'?0:(i===0?40:25),sets:[]}))};state.sessions.push(session);state.activeId=session.id;save();toast('Workout started.');setPage('activeWorkout')}
function renderActive(){const s=activeSession();if(!s){document.getElementById('activeWorkout').innerHTML='<div class="card"><div class="title">No active workout</div><p class="muted">Start a routine first.</p><button class="btn" onclick="setPage(\'workout\')">Choose Routine</button></div>';return}const pct=Math.round((completedExerciseCount(s)/s.exercises.length)*100);document.getElementById('activeWorkout').innerHTML=`<div class="hero"><div><div class="kicker">Active Workout</div><div class="title">${s.name}</div><div class="sub">${s.exercises.length} exercises • ${s.desc}</div></div>${hMascot()}</div><div class="card"><div class="row"><div class="label">Workout Progress</div><strong>${completedExerciseCount(s)} / ${s.exercises.length} exercises</strong></div><div class="progress-line"><span style="width:${pct}%"></span></div><p class="muted small">${sessionSets(s)} sets • ${sessionVolume(s)} KG volume</p></div>${s.exercises.map((e,i)=>exerciseHtml(s,e,i)).join('')}<div class="card rest"><div class="ring"></div><div><div class="timer">01:30</div><div class="green">Suggested Rest Time</div><p class="muted small">Rest after each completed set.</p></div></div><div class="card"><div class="field"><label>Workout Notes</label><textarea id="sessionNotes" maxlength="140" placeholder="Optional notes...">${esc(s.notes||'')}</textarea></div><button class="btn green-bg" onclick="finishWorkout()">⚑ Finish Workout</button><button class="btn dark" onclick="setPage('workout')">Back to Routines</button></div>`}
function exerciseHtml(s,e,i){const done=e.sets.length>=e.targetSets;const next=e.sets.length+1;return `<div class="card exercise-card ${!done?'current':''}"><div class="exercise-head"><div class="thumb">${e.emoji}</div><div><h2>${i+1}. ${e.name}</h2><p class="muted">${e.muscle} • ${e.equipment}</p></div><strong>${done?'✓':'⌄'}</strong></div><div class="set-head"><span>Set</span><span>Weight (KG)</span><span>Reps</span><span>Status</span></div>${e.sets.map((set,idx)=>`<div class="set-row"><div class="cell">${idx+1}</div><div class="cell">${set.kg} KG</div><div class="cell">${set.reps}</div><button class="check" onclick="removeSet(${i},${idx})">✓</button></div>`).join('')}<div class="set-row"><div class="cell">${next}</div><input class="cell" id="kg-${i}" inputmode="decimal" type="number" min="0" max="500" step="0.5" value="${e.sets.at(-1)?.kg??e.targetKg}"><input class="cell" id="reps-${i}" inputmode="numeric" type="number" min="1" max="100" step="1" value="${e.sets.at(-1)?.reps??e.targetReps}"><button class="check ${done?'ghost-check':''}" onclick="addSet(${i})">✓</button></div><div id="err-${i}" class="error"></div><button class="btn dark" onclick="addSet(${i})">＋ Add Set</button></div>`}
function addSet(i){const s=activeSession();if(!s)return;const e=s.exercises[i];const kgEl=document.getElementById('kg-'+i);const repsEl=document.getElementById('reps-'+i);const err=document.getElementById('err-'+i);const kg=Number(kgEl.value);const reps=Number(repsEl.value);kgEl.classList.remove('invalid');repsEl.classList.remove('invalid');err.classList.remove('show');if(!Number.isFinite(kg)||kg<0||kg>500){kgEl.classList.add('invalid');err.textContent='Weight must be between 0 and 500 KG.';err.classList.add('show');toast('Check the weight input.');return}if(!Number.isInteger(reps)||reps<1||reps>100){repsEl.classList.add('invalid');err.textContent='Reps must be a whole number from 1 to 100.';err.classList.add('show');toast('Check the reps input.');return}if(e.sets.length>=12){err.textContent='Maximum 12 sets per exercise for this demo.';err.classList.add('show');toast('Set limit reached.');return}e.sets.push({kg:Number(kg.toFixed(1)),reps,at:new Date().toISOString()});save();toast(`${e.name} set ${e.sets.length} saved.`);renderActive()}function removeSet(i,idx){const s=activeSession();if(!s)return;s.exercises[i].sets.splice(idx,1);save();toast('Set removed.');renderActive()}function finishWorkout(){const s=activeSession();if(!s)return;s.notes=document.getElementById('sessionNotes')?.value?.slice(0,140)||'';if(sessionSets(s)===0){toast('Add at least one set before finishing.');return}if(completedExerciseCount(s)<s.exercises.length){if(!confirm('Some exercises are not complete. Finish workout anyway?'))return}s.completed=true;s.completedAt=new Date().toISOString();s.durationMin=Math.max(1,Math.round((new Date(s.completedAt)-new Date(s.startedAt))/60000));state.activeId=null;lastFinished=s.id;save();toast('Workout completed.');setPage('share')}
function renderExercises(){const names=Object.keys(guide);document.getElementById('exercises').innerHTML=`<div class="hero"><div><div class="title">Exercise Guide</div><div class="sub">Correct form, target muscles, mistakes, and safety reminders.</div></div>${hMascot()}</div>${names.map(n=>{const g=guide[n];return `<div class="card guide-card"><div class="row"><div><div class="label">${g.muscle} • ${g.equipment}</div><div class="value">${n}</div></div><div class="thumb">${g.emoji}</div></div><h3>How to do it</h3><ol>${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h3>Common mistakes</h3><ul>${g.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul><p class="green"><b>Safety:</b> ${g.tip}</p></div>`}).join('')}`}
function renderProgress(){const done=completedSessions();document.getElementById('progress').innerHTML=`<div class="hero"><div><div class="title">Progress</div><div class="sub">Track your consistency and performance.</div></div>${hMascot()}</div><div class="stats"><div class="card stat"><div class="label">Workouts</div><div class="value">${done.length}</div><div class="muted">Completed</div></div><div class="card stat"><div class="label">Sets</div><div class="value">${done.reduce((a,s)=>a+sessionSets(s),0)}</div><div class="muted">Total</div></div><div class="card stat"><div class="label">Volume</div><div class="value">${weeklyVolume()}</div><div class="muted">KG</div></div></div><div class="card"><div class="row"><div class="label">Weekly Load</div><div class="label">Last 7</div></div>${chartHtml()}</div><div class="card"><div class="label">Recent Sessions</div>${done.length?done.slice(-5).reverse().map(s=>`<div class="card flat"><div class="row"><div><h2>${s.name}</h2><p class="muted">${sessionSets(s)} sets • ${sessionVolume(s)} KG • ${s.durationMin||1} min</p></div><span class="badge">✓ Completed</span></div></div>`).join(''):'<p class="muted">No completed workouts yet.</p>'}</div>`}
function renderNutrition(){const total=state.meals.reduce((a,m)=>a+m.cal,0);document.getElementById('nutrition').innerHTML=`<div class="hero"><div><div class="title">Nutrition</div><div class="sub">Simple food logging. Values are estimates only.</div></div>${hMascot()}</div><div class="card"><div class="label">Today</div><div class="value">${total}</div><p class="muted">/ 2,200 kcal estimated</p><div class="macro"><div class="macro-box"><b>120g</b><br><span class="muted">Protein</span></div><div class="macro-box"><b>180g</b><br><span class="muted">Carbs</span></div><div class="macro-box"><b>50g</b><br><span class="muted">Fats</span></div></div><button class="btn green-bg" onclick="toast('Food scan UI ready for next development phase.')">Scan Food</button><button class="btn dark" onclick="addMeal()">Add Meal</button></div>${state.meals.map((m,i)=>`<div class="card meal"><div class="food">${m.emoji}</div><div><h3>${m.meal}</h3><p class="muted">${m.name} • ${m.cal} kcal</p></div><button class="icon-btn" onclick="deleteMeal(${i})">×</button></div>`).join('')}`}
function addMeal(){const name=prompt('Meal name');if(!name||name.trim().length<2){toast('Meal name is required.');return}const cal=Number(prompt('Estimated calories'));if(!Number.isFinite(cal)||cal<1||cal>5000){toast('Calories must be 1 to 5000.');return}state.meals.push({name:name.trim().slice(0,40),meal:'Manual',cal:Math.round(cal),emoji:'🍽️'});save();toast('Meal added.');renderNutrition()}function deleteMeal(i){state.meals.splice(i,1);save();toast('Meal removed.');renderNutrition()}
function renderShare(){const s=state.sessions.find(x=>x.id===lastFinished)||completedSessions().at(-1);if(!s){setPage('progress');return}document.getElementById('share').innerHTML=`<div class="hero"><div><div class="title">Workout Done!</div><div class="sub">Save or share your Galaw workout summary.</div></div>${hMascot()}</div><div class="share-card"><span class="badge">✓ Completed</span><div class="value" style="margin-top:14px">${s.name}</div><p class="muted">${new Date(s.completedAt).toLocaleDateString()} • ${s.durationMin||1} min</p><div class="stats"><div class="card stat"><div class="label">Sets</div><div class="value">${sessionSets(s)}</div></div><div class="card stat"><div class="label">Volume</div><div class="value">${sessionVolume(s)}</div></div><div class="card stat"><div class="label">Exercises</div><div class="value">${completedExerciseCount(s)}</div></div></div><p class="green"><b>#Galaw #KeepMoving</b></p></div><div class="share-grid"><button class="btn green-bg" onclick="shareWorkout()">Share</button><button class="btn dark" onclick="setPage('home')">Back Home</button></div>`}
async function shareWorkout(){const s=state.sessions.find(x=>x.id===lastFinished)||completedSessions().at(-1);const text=`GALAW WORKOUT COMPLETE\n${s.name}\n${sessionSets(s)} sets • ${sessionVolume(s)} KG volume • ${s.durationMin||1} min\n#Galaw #KeepMoving`;if(navigator.share){try{await navigator.share({title:'Galaw Workout',text});toast('Sharing opened.')}catch(e){toast('Share cancelled.')}}else{navigator.clipboard?.writeText(text);toast('Summary copied.')}}
render();
</script>
</body>
</html>
