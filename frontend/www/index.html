<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaw</title>
  <style>
    :root{
      --bg:#050505;--card:#121212;--card2:#1a1a1a;--border:#303030;--text:#fff;--muted:#a7a7a7;--soft:#d8d8d8;--green:#46e17d;--darkGreen:#1c7b43;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;background:
      radial-gradient(circle at 78% 7%,rgba(255,255,255,.14),transparent 15%),
      radial-gradient(circle at 14% 12%,rgba(70,225,125,.10),transparent 18%),
      linear-gradient(180deg,#151515 0%,#070707 42%,#020202 100%);z-index:-3}
    body:after{content:"";position:fixed;inset:0;background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 88px),
      radial-gradient(ellipse at bottom right,rgba(255,255,255,.08),transparent 32%);opacity:.75;z-index:-2}
    .app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 22px) 18px 106px;position:relative}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.45)}
    .brand-name{font-size:31px;font-weight:900;letter-spacing:-1px}.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;display:grid;place-items:center;font-size:18px}
    .hero{position:relative;min-height:190px;margin-bottom:12px}.hero-text{position:relative;z-index:2}.kicker{font-size:13px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:800}.title{font-size:48px;line-height:.96;font-weight:950;letter-spacing:-2px;margin:8px 0 8px}.title .green{color:var(--green)}.sub{color:var(--soft);font-size:17px;line-height:1.35}.mascot-big{position:absolute;right:-8px;top:3px;width:185px;height:185px;z-index:1;filter:drop-shadow(0 18px 28px rgba(0,0,0,.72))}.coach{position:absolute;right:96px;top:5px;z-index:3;background:rgba(22,22,22,.92);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 13px;font-weight:800;line-height:1.28;box-shadow:0 12px 28px rgba(0,0,0,.35)}
    .card{background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(12,12,12,.98));border:1px solid rgba(255,255,255,.12);border-radius:25px;padding:18px;margin:13px 0;box-shadow:0 22px 58px rgba(0,0,0,.33);overflow:hidden}.card.soft{background:rgba(20,20,20,.86)}
    .label{font-size:12px;text-transform:uppercase;letter-spacing:2.3px;color:var(--muted);font-weight:800}.value{font-size:40px;font-weight:950;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:13px}.green{color:var(--green)}
    .btn{width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#fff,#e6e6e6);color:#050505;font-size:19px;font-weight:950;padding:16px 18px;margin-top:13px;box-shadow:0 14px 34px rgba(0,0,0,.35)}.btn.green-bg{background:linear-gradient(135deg,#55ed89,#27d66c)}.btn.dark{background:#080808;color:#fff;border:1px solid rgba(255,255,255,.16)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px 12px;min-height:116px}.stat .value{font-size:30px}.routine-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.mini{border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.04);padding:10px 6px;text-align:center;font-size:12px;min-height:78px}.mini b{font-size:22px;display:block;margin-bottom:5px}.chart{height:118px;display:flex;gap:13px;align-items:flex-end;margin-top:18px}.bar{flex:1;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#fff,#696969);position:relative;min-height:10px}.bar.greenbar{background:linear-gradient(180deg,#62ee90,#1a8e4a)}.bar span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}.day{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:#bfbfbf;font-size:12px}.day.done{background:rgba(70,225,125,.25);color:#fff;border:1px solid var(--green)}
    .routine-card{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}.thumb{height:92px;border-radius:18px;background:linear-gradient(135deg,#1f1f1f,#060606);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:40px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.chipbar{display:flex;gap:10px;overflow-x:auto;padding:3px 0 9px}.chip{border:0;border-radius:17px;padding:13px 21px;background:rgba(255,255,255,.08);color:#bdbdbd;font-weight:800}.chip.active{background:#fff;color:#050505}.quick{display:flex;gap:16px;color:#e5e5e5;font-size:13px;margin:10px 0}.start-small{width:auto;min-width:100px;margin:0;padding:13px 16px;background:linear-gradient(135deg,#57ed8c,#2edb70)}
    .progress-line{height:18px;background:#2b2b2b;border-radius:99px;overflow:hidden;margin-top:13px}.progress-line span{height:100%;background:linear-gradient(90deg,#46e17d,#7cffaa);display:block;border-radius:99px}.exercise-head{display:grid;grid-template-columns:88px 1fr auto;gap:13px;align-items:center}.set-head,.set-row{display:grid;grid-template-columns:44px 1fr 88px 58px;gap:8px;align-items:center}.set-head{color:#aaa;text-transform:uppercase;font-size:11px;letter-spacing:1.6px;margin:14px 0 7px}.cell{background:#090909;border:1px solid #383838;border-radius:13px;padding:13px;text-align:center;color:#fff;width:100%;font-size:16px}.check{background:var(--green);color:#020202;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;font-weight:900}.empty-check{background:transparent;border:2px solid #666;color:transparent}.rest{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--green) 70%,#333 0);display:grid;place-items:center}.ring:after{content:"";width:62px;height:62px;border-radius:50%;background:#111;display:block}.timer{font-size:38px;font-weight:950}
    .guide-card h3{margin:14px 0 8px}.guide-card li{margin:7px 0;color:#dedede}.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bodybox{height:190px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:78px}.meal{display:grid;grid-template-columns:75px 1fr auto;gap:13px;align-items:center}.food{width:75px;height:75px;border-radius:18px;background:linear-gradient(135deg,#eee,#777);display:grid;place-items:center;font-size:34px}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.macro-box{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:13px 6px;background:rgba(255,255,255,.04)}
    .share-card{background:radial-gradient(circle at top right,rgba(70,225,125,.16),transparent 28%),linear-gradient(145deg,#1c1c1c,#080808);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:20px;position:relative}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:99px;font-weight:900}.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(14,14,14,.98);border-top:1px solid rgba(255,255,255,.10);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(env(safe-area-inset-bottom) + 14px);z-index:20;backdrop-filter:blur(18px)}.tab{background:transparent;border:0;color:#aaa;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:22px}.tab b{font-size:22px;line-height:1}.tab.active{color:#fff;background:rgba(255,255,255,.08)}.hidden{display:none!important}@media(max-width:390px){.title{font-size:42px}.mascot-big{width:155px;height:155px}.hero{min-height:170px}.stats{grid-template-columns:1fr 1fr}.routine-card{grid-template-columns:88px 1fr}.thumb{height:84px}.set-head,.set-row{grid-template-columns:36px 1fr 68px 48px}.cell{padding:11px 7px}.tabs{max-width:none}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand"><div class="logo" id="logo"></div><div class="brand-name">Galaw</div></div>
      <div class="row"><button class="icon-btn">⌕</button><button class="icon-btn">🔔</button></div>
    </div>
    <section id="home"></section>
    <section id="workout" class="hidden"></section>
    <section id="activeWorkout" class="hidden"></section>
    <section id="exercises" class="hidden"></section>
    <section id="progress"></section>
    <section id="nutrition" class="hidden"></section>
    <section id="share" class="hidden"></section>
  </main>
  <nav class="tabs">
    <button class="tab active" data-page="home"><b>⌂</b>Home</button>
    <button class="tab" data-page="workout"><b>🏋</b>Workout</button>
    <button class="tab" data-page="exercises"><b>▦</b>Exercises</button>
    <button class="tab" data-page="progress"><b>▥</b>Progress</button>
    <button class="tab" data-page="nutrition"><b>🍎</b>Nutrition</button>
  </nav>
<script>
const mascotSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#464646"/><stop offset="1" stop-color="#090909"/></linearGradient></defs><rect width="120" height="120" rx="30" fill="#050505"/><path d="M31 39C14 20 20 9 43 31M89 39c17-19 11-30-12-8" fill="none" stroke="#ddd" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="61" r="35" fill="url(#g)" stroke="#eee" stroke-width="4"/><ellipse cx="60" cy="70" rx="22" ry="15" fill="#d9d9d9"/><circle cx="48" cy="55" r="5" fill="#fff"/><path d="M70 54q10-5 18 4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M46 76q13 11 29 0" stroke="#050505" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M26 91l-12 12" stroke="#46e17d" stroke-width="10" stroke-linecap="round"/></svg>`;
const mascotLarge=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260"><path d="M65 76C18 20 33-1 92 57M195 76c47-56 32-77-27-19" fill="none" stroke="#ddd" stroke-width="18" stroke-linecap="round"/><circle cx="130" cy="125" r="74" fill="#1b1b1b" stroke="#f1f1f1" stroke-width="8"/><ellipse cx="130" cy="146" rx="45" ry="30" fill="#d9d9d9"/><circle cx="106" cy="111" r="10" fill="#fff"/><path d="M148 106q23-12 42 10" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M101 159q30 24 62 0" stroke="#050505" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M48 196l-26 26" stroke="#46e17d" stroke-width="18" stroke-linecap="round"/><path d="M182 178q35 9 49 44" stroke="#f5f5f5" stroke-width="18" fill="none" stroke-linecap="round"/></svg>`;
document.getElementById('logo').innerHTML=mascotSvg;
const routines=[
 {id:'push',name:'Push Day',desc:'Chest, Shoulders, Triceps',mins:45,emoji:'🏋️',ex:['Bench Press','Overhead Press','Tricep Pushdown','Incline Press','Lateral Raise','Push-up']},
 {id:'pull',name:'Pull Day',desc:'Back, Biceps',mins:45,emoji:'💪',ex:['Barbell Row','Assisted Pull-up','Bicep Curl','Cable Curl','Face Pull','Lat Pulldown']},
 {id:'leg',name:'Leg Day',desc:'Quads, Hamstrings, Glutes, Calves',mins:50,emoji:'🦵',ex:['Squat','Bulgarian Split Squat','Leg Press','Romanian Deadlift','Leg Curl','Calf Raise','Lunge']},
 {id:'full',name:'Full Body',desc:'Chest, Back, Legs, Shoulders, Arms, Core',mins:60,emoji:'🔥',ex:['Squat','Bench Press','Barbell Row','Overhead Press','Cable Crunch','Bicep Curl','Tricep Pushdown','Plank']}
];
const guides={
 'Bench Press':{muscle:'Chest',equipment:'Barbell',steps:['Lie flat on the bench with your eyes under the bar.','Grip slightly wider than shoulder width.','Lower the bar slowly to your mid-chest.','Press the bar upward with control.'],mistakes:['Bouncing the bar on the chest','Flaring elbows too wide','Using too much weight too early'],tip:'Keep your feet planted and use a spotter when lifting heavy.'},
 'Overhead Press':{muscle:'Shoulders',equipment:'Barbell',steps:['Stand tall with the bar at shoulder level.','Keep your core tight.','Press the bar overhead in a straight path.','Lower the bar slowly back to the shoulders.'],mistakes:['Leaning too far backward','Using momentum','Not controlling the lowering phase'],tip:'Keep your ribs down and avoid over-arching your lower back.'},
 'Tricep Pushdown':{muscle:'Triceps',equipment:'Cable',steps:['Stand facing the cable machine.','Keep elbows close to your body.','Push the handle down until arms are extended.','Return slowly to the starting position.'],mistakes:['Moving elbows forward','Using body swing','Rushing the reps'],tip:'Use a weight you can control without swinging.'},
 'Barbell Row':{muscle:'Back',equipment:'Barbell',steps:['Hinge at the hips with a neutral spine.','Pull the bar toward your lower ribs.','Squeeze your back muscles.','Lower the bar with control.'],mistakes:['Rounding the lower back','Jerking the bar','Standing too upright'],tip:'Maintain a neutral spine throughout the movement.'},
 'Squat':{muscle:'Legs',equipment:'Barbell',steps:['Place the bar securely on your upper back.','Keep feet shoulder-width apart.','Lower your hips while keeping your chest up.','Stand back up with control.'],mistakes:['Knees collapsing inward','Heels lifting off the floor','Rounding the back'],tip:'Start light and focus on controlled depth.'},
 'Bicep Curl':{muscle:'Biceps',equipment:'Dumbbell',steps:['Stand tall with dumbbells at your sides.','Keep elbows close to your body.','Curl the dumbbells upward.','Lower slowly with control.'],mistakes:['Swinging the body','Moving elbows forward','Dropping the weight too fast'],tip:'Control the movement and avoid swinging.'}
};
let appState=JSON.parse(localStorage.getItem('galaw_state_v2')||'{"sessions":[]}');
let currentSession=null;
function save(){localStorage.setItem('galaw_state_v2',JSON.stringify(appState))}
function totalSets(s){return s.exercises.reduce((a,e)=>a+e.sets.length,0)}
function totalVolume(s){return s.exercises.reduce((a,e)=>a+e.sets.reduce((x,t)=>x+(Number(t.kg)*Number(t.reps)),0),0)}
function completed(){return appState.sessions.filter(s=>s.done)}
function show(page){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));const el=document.getElementById(page);if(el)el.classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));render(page)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.page));
function hero(title,sub,coach='') {return `<div class="hero"><div class="hero-text"><div class="title">${title}</div><div class="sub">${sub}</div></div>${coach?`<div class="coach">${coach}</div>`:''}<div class="mascot-big">${mascotLarge}</div></div>`}
function render(page){const map={home,workout,activeWorkout,exercises,progress,nutrition,share};(map[page]||home)()}
function home(){const done=completed();const vol=done.reduce((a,s)=>a+totalVolume(s),0);const sets=done.reduce((a,s)=>a+totalSets(s),0);document.getElementById('home').innerHTML=hero('Good morning,<br>Bryl!','Same discipline.<br>Stronger you.')+`<div class="card"><div class="row"><div><div class="label">Today’s Routine</div><div class="value">Push Day</div></div><div class="label">MON, APR 25, 2026</div></div><p class="muted">6 exercises • ~45 min • Chest, Shoulders, Triceps</p><div class="routine-mini"><div class="mini"><b>🏋️</b>Bench Press</div><div class="mini"><b>🙆</b>Overhead<br>Press</div><div class="mini"><b>🪢</b>Tricep<br>Pushdown</div><div class="mini"><b>+3</b>more</div></div><button class="btn" onclick="startWorkout('push')">▶ Start Workout</button></div><div class="stats"><div class="card stat"><div class="label">Weekly Volume</div><div class="value">${vol||5756}</div><div class="muted">KG</div><div class="green small">↑ +12% vs. last week</div></div><div class="card stat"><div class="label">Streak</div><div class="value">${done.length?2:0}</div><div class="muted">Weeks</div><div class="green">● ● ● ○ ○</div></div><div class="card stat"><div class="label">This Week</div><div class="value">${done.length||2}/4</div><div class="muted">Workouts</div></div></div><div class="card"><div class="row"><div class="label">Weekly Progress</div><div class="label">Volume (KG)</div></div>${chart()}</div><div class="card routine-card"><div class="thumb">🏋️</div><div><div class="label">Recent Workout</div><h2>Push Day</h2><p class="muted">${sets||20} sets • 28m 7s • ${vol||4183} KG</p><span class="badge">✓ Completed</span></div></div>`}
function chart(){const vals=[29,34,58,18,41,26,8],labs=['MON','TUE','WED','THU','FRI','SAT','SUN'];return `<div class="chart">${vals.map((v,i)=>`<div class="bar ${i==2?'greenbar':''}" style="height:${v*1.45}px"><span>${i==6?'0':(v/10).toFixed(1)+'K'}</span></div>`).join('')}</div><div class="row small muted">${labs.map(x=>`<span>${x}</span>`).join('')}</div>`}
function workout(){document.getElementById('workout').innerHTML=hero('Routines','Build consistency<br>with reusable workouts.')+`<div class="chipbar"><button class="chip active">All</button><button class="chip">Upper Body</button><button class="chip">Lower Body</button><button class="chip">Full Body</button></div>`+routines.map((r,i)=>`<div class="card routine-card"><div class="thumb">${r.emoji}</div><div><div class="row"><h2>${r.name}</h2><span>⋮</span></div><p class="muted">${r.desc}</p><div class="quick"><span>🏋 ${r.ex.length} exercises</span><span>◷ ~${r.mins} min</span></div></div><button class="btn start-small ${i%2?'dark':'green-bg'}" onclick="startWorkout('${r.id}')">${i%2?'View ›':'▶ Start'}</button></div>`).join('')+`<button class="btn green-bg">＋ Add Routine</button>`}
function startWorkout(id){const r=routines.find(x=>x.id===id)||routines[0];currentSession={id:Date.now(),name:r.name,desc:r.desc,started:new Date().toISOString(),done:false,exercises:r.ex.slice(0,3).map((name,idx)=>({name,sets:idx===0?[{kg:60,reps:12},{kg:80,reps:10},{kg:80,reps:8}]:[]}))};appState.sessions.push(currentSession);save();show('activeWorkout')}
function activeWorkout(){if(!currentSession){currentSession=appState.sessions.find(s=>!s.done)||appState.sessions[appState.sessions.length-1]}if(!currentSession){startWorkout('push');return}const progress=Math.min(100,totalSets(currentSession)*9);document.getElementById('activeWorkout').innerHTML=`<div class="hero"><div class="hero-text"><div class="kicker">Active Workout</div><div class="title">${currentSession.name}</div><div class="sub">${currentSession.exercises.length+3} exercises • ${currentSession.desc||'Chest, Shoulders, Triceps'}</div></div><div class="coach">Let's get it,<br>Bryl! 💪</div><div class="mascot-big">${mascotLarge}</div></div><div class="card"><div class="row"><div class="label">Workout Progress</div><b>${Math.min(6,currentSession.exercises.filter(e=>e.sets.length).length)} / 6 exercises</b></div><div class="progress-line"><span style="width:${progress}%"></span></div></div>`+currentSession.exercises.map((e,i)=>exercisePanel(e,i)).join('')+`<div class="card rest"><div class="ring"></div><div><div class="timer">01:30</div><div class="green">Rest Time</div><p class="muted">Up next: Set ${currentSession.exercises[0].sets.length+1} • Bench Press</p></div></div><button class="btn green-bg" onclick="finishWorkout()">⚑ Finish Workout</button>`}
function exercisePanel(e,i){const g=guides[e.name]||{muscle:'Workout',equipment:'Equipment'};return `<div class="card"><div class="exercise-head"><div class="thumb">🏋️</div><div><h2>${i+1}. ${e.name}</h2><p class="muted">${g.muscle} • ${g.equipment}</p></div><b>${i==0?'⌃':'⌄'}</b></div>${i==0?`<div class="set-head"><span>Set</span><span>Weight (KG)</span><span>Reps</span><span>Status</span></div>${e.sets.map((s,idx)=>`<div class="set-row"><div class="cell">${idx+1}</div><div class="cell">${s.kg} <span class="muted">KG</span></div><div class="cell">${s.reps}</div><button class="check">✓</button></div>`).join('')}<div class="set-row"><div class="cell">${e.sets.length+1}</div><input id="kg-${i}" class="cell" type="number" value="85"><input id="reps-${i}" class="cell" type="number" value="6"><button class="check empty-check" onclick="addSet(${i})">○</button></div><button class="btn dark" onclick="addSet(${i})">＋ Add Set</button>`:''}</div>`}
function addSet(i){const kg=document.getElementById('kg-'+i)?.value||40;const reps=document.getElementById('reps-'+i)?.value||10;currentSession.exercises[i].sets.push({kg,reps});save();activeWorkout()}
function finishWorkout(){if(!currentSession)return;currentSession.done=true;currentSession.ended=new Date().toISOString();save();show('share')}
function share(){const s=currentSession||completed().slice(-1)[0]||{name:'Push Day',exercises:[]};const vol=totalVolume(s)||4183;const sets=totalSets(s)||20;document.getElementById('share').innerHTML=`<div class="title">Workout<br><span class="green">Completed!</span></div><div class="sub">Great work, Bryl! Consistency builds a stronger you.</div><div class="share-card"><div class="row"><div class="brand"><div class="logo">${mascotSvg}</div><div class="brand-name">Galaw</div></div><span class="badge">✓ Completed</span></div><div class="title">${s.name}</div><p class="sub">Same discipline.<br>Stronger you.</p><div class="share-grid"><div class="card soft"><div class="label">Duration</div><h2>28 min 7 sec</h2></div><div class="card soft"><div class="label">Exercises</div><h2>5 exercises</h2></div><div class="card soft"><div class="label">Total Sets</div><h2>${sets} sets</h2></div><div class="card soft"><div class="label">Total Volume</div><h2>${vol} KG</h2></div></div><h2>Consistency builds a stronger you.</h2></div><button class="btn">⇧ Share</button><button class="btn dark">⇩ Save Image</button><button class="btn dark" onclick="currentSession=null;show('home')">⌂ Back to Home</button>`}
function exercises(){const names=Object.keys(guides);document.getElementById('exercises').innerHTML=hero('Exercise Guide','Correct form, target muscles,<br>common mistakes, and safety tips.')+names.map((name,idx)=>{const g=guides[name];return `<div class="card guide-card"><div class="label">${g.muscle} • ${g.equipment}</div><div class="value">${name}</div>${idx===0?`<div class="bodymap"><div class="bodybox">🧍</div><div class="bodybox">💪</div></div>`:''}<h3>How to do it</h3><ol>${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h3>Common mistakes</h3><ul>${g.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul><p class="green"><b>Safety:</b> ${g.tip}</p></div>`}).join('')}
function progress(){const done=completed();const vol=done.reduce((a,s)=>a+totalVolume(s),0);const sets=done.reduce((a,s)=>a+totalSets(s),0);document.getElementById('progress').innerHTML=hero('Progress','Track your consistency.<br>See your gains.')+`<div class="stats"><div class="card stat"><div class="label">Weekly Workouts</div><div class="value">${done.length||4}/4</div><div class="green">↑ +100%</div></div><div class="card stat"><div class="label">Streak</div><div class="value">2</div><div class="muted">Weeks</div></div><div class="card stat"><div class="label">Personal Record</div><div class="value">100</div><div class="muted">KG Bench Press</div></div></div><div class="card"><div class="label">April 2026</div><div class="days">${Array.from({length:35},(_,i)=>`<div class="day ${[3,6,9,14,17,20,22,24,27].includes(i)?'done':''}">${(i%30)+1}</div>`).join('')}</div></div><div class="card"><div class="row"><div class="label">Weekly Training Load</div><div class="label">Volume (KG)</div></div>${chart()}</div><div class="card"><div class="label">Recent Achievement</div><h2>Consistency King</h2><p class="muted">Completed 4 workouts in a week.</p><span class="badge">✓ Unlocked</span></div>`}
function nutrition(){document.getElementById('nutrition').innerHTML=hero('Nutrition','Fuel your goals.<br>Same discipline. Stronger you.')+`<div class="card"><div class="row"><div><div class="label">Today</div><div class="value">1,480</div><p class="muted">/ 2,200 kcal estimated</p></div><div class="ring"></div></div><div class="macro"><div class="macro-box"><h2>138g</h2><p class="muted">Protein</p></div><div class="macro-box"><h2>165g</h2><p class="muted">Carbs</p></div><div class="macro-box"><h2>42g</h2><p class="muted">Fats</p></div></div><button class="btn dark">▢ Scan Food</button><button class="btn">＋ Add Meal</button></div><div class="label">Today’s Meals <span class="muted">1,480 kcal estimated</span></div><div class="card meal"><div class="food">🥣</div><div><h3>Breakfast</h3><p class="muted">Oatmeal with Banana • 320 kcal</p><p class="green">12g Protein • 54g Carbs • 7g Fats</p></div><b>›</b></div><div class="card meal"><div class="food">🍗</div><div><h3>Lunch</h3><p class="muted">Grilled Chicken, Rice & Broccoli • 680 kcal</p><p class="green">62g Protein • 70g Carbs • 18g Fats</p></div><b>›</b></div><div class="card meal"><div class="food">🥤</div><div><h3>Snack</h3><p class="muted">Protein Shake • 280 kcal</p><p class="green">24g Protein • 24g Carbs • 6g Fats</p></div><b>›</b></div><p class="muted small">Nutrition values are estimates and may vary based on brands and preparation.</p>`}
show('home');
</script>
</body>
</html>
