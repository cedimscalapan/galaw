<!doctype html>
<html lang='en'>
<head>

<title>Galaw</title>
<style>
:root{--bg:#050505;--panel:#111;--panel2:#181818;--line:rgba(255,255,255,.12);--text:#fff;--muted:#b9b9b9;--muted2:#7d7d7d;--green:#45e07d;--danger:#ff6262;--nav:88px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 80% 0,rgba(255,255,255,.11),transparent 260px),radial-gradient(circle at 10% 8%,rgba(69,224,125,.12),transparent 220px),linear-gradient(180deg,#151515,#050505 48%,#020202)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(var(--nav) + env(safe-area-inset-bottom) + 22px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;object-fit:cover;border:1px solid var(--line);background:#000}.brand h1{margin:0;font-size:31px;line-height:1;font-weight:900;letter-spacing:-1px}.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);padding:10px 12px;border-radius:99px;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:99px;background:var(--green);box-shadow:0 0 14px rgba(69,224,125,.8)}.card{background:linear-gradient(145deg,rgba(25,25,25,.98),rgba(8,8,8,.98));border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 20px 52px rgba(0,0,0,.38);overflow:hidden}.card+.card,.section{margin-top:14px}.flat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:14px}.kicker,.label{color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:3px}.title{font-size:42px;line-height:.98;font-weight:950;letter-spacing:-2px;margin:0}.sub{color:var(--muted);font-size:16px;line-height:1.4;margin:10px 0 0}.value{font-size:34px;font-weight:950;letter-spacing:-1px}.muted{color:var(--muted)}.green{color:var(--green)}.danger{color:var(--danger)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.hero{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;min-height:190px}.hero img{width:110px;height:110px;border-radius:30px;object-fit:cover;border:1px solid var(--line);box-shadow:0 16px 36px rgba(0,0,0,.55)}.btn{width:100%;min-height:54px;border:0;border-radius:18px;padding:14px 16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:950;font-size:16px}.btn:active{transform:scale(.985)}.primary{background:linear-gradient(135deg,#fff,#e8e8e8);color:#050505}.success{background:linear-gradient(135deg,#65ee95,#24c865);color:#031108}.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}.remove{background:rgba(255,98,98,.1);border:1px solid rgba(255,98,98,.3);color:#ffb6b6}.small{width:auto;min-height:42px;border-radius:15px;font-size:14px;padding:10px 14px}.iconbtn{width:42px;height:42px;min-height:42px;padding:0;border-radius:50%}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{min-height:115px;display:grid;align-content:start;gap:8px}.stat .value{font-size:29px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.tile{min-height:74px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);display:grid;place-items:center;text-align:center;gap:5px;padding:9px 6px;font-size:12px;font-weight:800}.tile svg{width:25px;height:25px}.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--muted);border-radius:99px;padding:12px 17px;font-weight:850;white-space:nowrap}.chip.on{background:#fff;color:#050505}.routine{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}.thumb{width:78px;height:78px;border:1px solid var(--line);border-radius:20px;background:#0b0b0b;display:grid;place-items:center}.thumb svg{width:38px;height:38px}.meta{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:9px 0}.barline{height:12px;background:#2d2d2d;border-radius:99px;overflow:hidden}.barline span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7dffad)}.chart{height:120px;display:flex;align-items:end;gap:10px;margin-top:17px}.barwrap{flex:1;text-align:center;color:var(--muted);font-size:11px;display:grid;gap:7px}.bar{height:var(--h);min-height:8px;border-radius:12px 12px 5px 5px;background:linear-gradient(#f7f7f7,#666);position:relative}.bar.on{background:linear-gradient(#69ee97,#1f8f4c)}.bar b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff}.exhead{display:grid;grid-template-columns:60px 1fr 42px;gap:12px;align-items:center}.exicon{width:60px;height:60px;border:1px solid var(--line);border-radius:17px;background:#090909;display:grid;place-items:center}.exicon svg{width:32px;height:32px}.sethead,.setrow{display:grid;grid-template-columns:38px minmax(76px,1fr) minmax(60px,.7fr) 42px;gap:7px;align-items:center}.sethead{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:2px;font-weight:900;margin:16px 0 8px}.setrow{margin:8px 0}.cell,.field{min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px}.field{width:100%;font-weight:850;outline:0}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(69,224,125,.13)}.inputrow{display:grid;grid-template-columns:1fr .75fr 44px;gap:8px;margin-top:12px}.inputbox{display:grid;gap:6px}.inputbox label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:2px;font-weight:900}.check{width:44px;height:44px;border:0;border-radius:50%;background:var(--green);color:#031108;display:grid;place-items:center}.delete{width:42px;height:42px;border-radius:50%;background:transparent;border:1px solid rgba(255,98,98,.3);color:#ffaaa9;display:grid;place-items:center}.help{font-size:12px;color:var(--muted2);line-height:1.35;margin:8px 0 0}.search{width:100%;min-height:52px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.055);color:#fff;padding:0 15px;outline:0}.search:focus{border-color:var(--green)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.day{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.055);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:850}.day.done{background:rgba(69,224,125,.16);border:1px solid rgba(69,224,125,.45);color:#fff}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.sharestats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(140%);width:calc(100% - 36px);max-width:440px;background:#151515;border:1px solid var(--line);border-radius:18px;padding:13px 15px;z-index:80;font-weight:850;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{border-color:rgba(255,98,98,.5)}.toast.ok{border-color:rgba(69,224,125,.5)}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:90;display:none;align-items:end;padding:18px}.modalbg.show{display:flex}.modal{width:100%;max-width:440px;margin:0 auto;background:#121212;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 22px 58px rgba(0,0,0,.48)}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px 10px calc(env(safe-area-inset-bottom) + 12px);background:rgba(12,12,12,.96);border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:50}.tab{border:0;background:transparent;color:var(--muted);border-radius:20px;min-height:62px;padding:8px 4px;display:grid;place-items:center;gap:4px;font-size:11px;font-weight:800}.tab svg{width:22px;height:22px}.tab.on{color:#fff;background:rgba(255,255,255,.08)}.empty{text-align:center;color:var(--muted);padding:18px 8px}@media(max-width:390px){.app{padding-left:14px;padding-right:14px}.title{font-size:36px}.hero{grid-template-columns:1fr 82px;min-height:165px}.hero img{width:82px;height:82px;border-radius:24px}.tiles{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.routine{grid-template-columns:66px 1fr}.thumb{width:66px;height:66px}.sethead,.setrow{grid-template-columns:34px minmax(58px,1fr) minmax(48px,.7fr) 40px;gap:6px}.cell,.field{font-size:14px;padding:7px}.tabs{max-width:none}}
</style>
</head>
<body>
<main class='app'>
<header class='top'><div class='brand'><img class='logo' src='assets/galaw-logo.svg' alt='Galaw logo'><h1>Galaw</h1></div><div class='pill'><span class='dot'></span><span id='net'>Offline ready</span></div></header>
<section id='screen'></section>
</main>
<nav class='tabs' id='tabs'></nav>
<div class='toast' id='toast'></div>
<div class='modalbg' id='modal'><div class='modal'><div class='kicker'>Confirm action</div><h2 id='mt' style='margin:0 0 8px;font-size:26px'>Continue?</h2><p id='mm' class='muted' style='line-height:1.45;margin:0 0 18px'></p><div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'><button class='btn ghost' id='mc'>Cancel</button><button class='btn success' id='my'>Continue</button></div></div></div>
<script>
const I={home:`<svg viewBox='0 0 24 24' fill='none'><path d='M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.5Z' stroke='currentColor' stroke-width='2' stroke-linejoin='round'/></svg>`,dumb:`<svg viewBox='0 0 24 24' fill='none'><path d='M6 7v10M9 6v12M15 6v12M18 7v10M9 12h6M3 9v6M21 9v6' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>`,grid:`<svg viewBox='0 0 24 24' fill='none'><path d='M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z' stroke='currentColor' stroke-width='2'/></svg>`,chart:`<svg viewBox='0 0 24 24' fill='none'><path d='M5 19V9m7 10V5m7 14v-7' stroke='currentColor' stroke-width='2.4' stroke-linecap='round'/><path d='M4 20h17' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>`,apple:`<svg viewBox='0 0 24 24' fill='none'><path d='M12 8c-3-3-8-1-8 4 0 5 3 9 6 8 1-.4 3-.4 4 0 3 1 6-3 6-8 0-5-5-7-8-4Z' stroke='currentColor' stroke-width='2'/><path d='M13 5c1.6-2 3-2.2 4-2-1 2-2.3 2.8-4 2ZM12 8c0-2-1-3-2-4' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>`,play:`<svg viewBox='0 0 24 24' fill='currentColor'><path d='M8 5v14l11-7L8 5Z'/></svg>`,check:`<svg viewBox='0 0 24 24' fill='none'><path d='m5 13 4 4L19 7' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>`,trash:`<svg viewBox='0 0 24 24' fill='none'><path d='M5 7h14M10 11v6M14 11v6M8 7l1-3h6l1 3m-9 0 1 13h8l1-13' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>`,plus:`<svg viewBox='0 0 24 24' fill='none'><path d='M12 5v14M5 12h14' stroke='currentColor' stroke-width='2.5' stroke-linecap='round'/></svg>`,flag:`<svg viewBox='0 0 24 24' fill='none'><path d='M6 21V4m0 0h10l-1.5 4L18 12H6' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>`,arr:`<svg viewBox='0 0 24 24' fill='none'><path d='m9 6 6 6-6 6' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>`};
function eicon(){return I.dumb}
const R=[{id:'push',name:'Push Day',focus:'Upper Body',desc:'Chest, Shoulders, Triceps',min:45,ex:[['Bench Press','Chest','Barbell',3,10,40],['Overhead Press','Shoulders','Barbell',3,10,25],['Tricep Pushdown','Triceps','Cable',3,12,20]]},{id:'pull',name:'Pull Day',focus:'Upper Body',desc:'Back, Biceps',min:45,ex:[['Barbell Row','Back','Barbell',3,10,35],['Assisted Pull-up','Back','Machine',3,8,0],['Bicep Curl','Biceps','Dumbbell',3,12,10]]},{id:'leg',name:'Leg Day',focus:'Lower Body',desc:'Quads, Hamstrings, Glutes',min:50,ex:[['Squat','Legs','Barbell',4,8,40],['Romanian Deadlift','Legs','Barbell',3,10,35],['Calf Raise','Legs','Machine',3,15,30]]},{id:'full',name:'Full Body',focus:'Full Body',desc:'Chest, Back, Legs, Core',min:60,ex:[['Squat','Legs','Barbell',3,8,35],['Bench Press','Chest','Barbell',3,10,35],['Barbell Row','Back','Barbell',3,10,30],['Plank','Core','Bodyweight',3,1,0]]}];
const G={'Bench Press':{m:'Chest',eq:'Barbell',s:['Lie flat with your eyes under the bar.','Grip slightly wider than shoulder width.','Lower the bar slowly to mid-chest.','Press upward with control.'],x:['Bouncing the bar on the chest','Flaring elbows too wide','Using weight you cannot control'],t:'Keep feet planted and use a spotter when lifting heavy.'},'Overhead Press':{m:'Shoulders',eq:'Barbell',s:['Stand tall with the bar at shoulder level.','Keep your core tight.','Press overhead in a straight path.','Lower slowly.'],x:['Leaning too far back','Using momentum','Rushing the lowering phase'],t:'Avoid over-arching your lower back.'},'Tricep Pushdown':{m:'Triceps',eq:'Cable',s:['Stand facing the cable machine.','Keep elbows close to your body.','Push the handle down until arms extend.','Return slowly with control.'],x:['Moving elbows forward','Swinging the body','Using too much weight'],t:'Use a weight you can control.'},'Barbell Row':{m:'Back',eq:'Barbell',s:['Hinge at the hips with a neutral spine.','Pull the bar toward your lower ribs.','Squeeze your back muscles.','Lower with control.'],x:['Rounding the back','Jerking the bar'],t:'Keep your spine neutral.'},'Squat':{m:'Legs',eq:'Barbell',s:['Place the bar securely on your upper back.','Keep feet shoulder-width apart.','Lower hips while keeping chest up.','Stand back up with control.'],x:['Knees collapsing inward','Heels lifting','Rounding the back'],t:'Start light and focus on clean form.'},'Bicep Curl':{m:'Biceps',eq:'Dumbbell',s:['Stand tall with dumbbells at your sides.','Keep elbows close.','Curl upward without swinging.','Lower slowly.'],x:['Swinging the body','Moving elbows forward'],t:'Control every rep.'},'Assisted Pull-up':{m:'Back',eq:'Machine',s:['Set the assistance level.','Grip the handles securely.','Pull your chest toward the bar.','Lower slowly.'],x:['Half reps','Dropping too fast'],t:'Use full controlled range.'},'Romanian Deadlift':{m:'Legs',eq:'Barbell',s:['Hold the bar in front of thighs.','Push hips back with neutral spine.','Lower until hamstrings stretch.','Stand by driving hips forward.'],x:['Rounding the back','Letting the bar drift away'],t:'Keep the bar close to your legs.'},'Calf Raise':{m:'Legs',eq:'Machine',s:['Stand with feet secure.','Raise heels slowly.','Pause at the top.','Lower with control.'],x:['Bouncing reps','Incomplete range'],t:'Use slow full movement.'},'Plank':{m:'Core',eq:'Bodyweight',s:['Set elbows under shoulders.','Keep body in a straight line.','Brace your core.','Hold without sagging hips.'],x:['Dropping hips','Holding breath'],t:'Stop when form breaks.'}};
const K='galaw_ready_v2';let S=load(),P='home',F='All',SG='Bench Press',last=null,act=null;function load(){try{return Object.assign({sessions:[],active:null,meals:[],name:'Bryl'},JSON.parse(localStorage.getItem(K)||'{}'))}catch{return{sessions:[],active:null,meals:[],name:'Bryl'}}}function save(){localStorage.setItem(K,JSON.stringify(S))}function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function $(x){return document.getElementById(x)}function kg(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1})}function dur(s){let e=s.end?new Date(s.end):new Date(),d=Math.max(0,Math.floor((e-new Date(s.start))/1000)),m=Math.floor(d/60),r=d%60;return m?`${m}m ${String(r).padStart(2,'0')}s`:`${r}s`}function sets(s){return s.ex.reduce((a,e)=>a+e.sets.length,0)}function vol(s){return s.ex.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+Number(t.kg)*Number(t.reps),0),0)}function done(){return S.sessions.filter(s=>s.done).sort((a,b)=>new Date(b.start)-new Date(a.start))}function active(){return S.sessions.find(s=>s.id===S.active&&!s.done)}function progress(s){let t=s.ex.reduce((a,e)=>a+e.ts,0);return t?Math.min(100,Math.round(sets(s)/t*100)):0}function comp(s){return s.ex.filter(e=>e.sets.length>=e.ts).length}function toast(m,ok=false){let t=$('toast');t.textContent=m;t.className='toast show '+(ok?'ok':'err');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2200)}function modal(title,msg,fn){$('mt').textContent=title;$('mm').textContent=msg;act=fn;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show');act=null}$('mc').onclick=closeM;$('my').onclick=()=>{let f=act;closeM();if(f)f()};
function page(p){P=p;render();scrollTo({top:0,behavior:'smooth'})}function tabs(){let a=[['home','Home',I.home],['workout','Workout',I.dumb],['exercises','Exercises',I.grid],['progress','Progress',I.chart],['nutrition','Nutrition',I.apple]];$('tabs').innerHTML=a.map(x=>`<button class='tab ${P===x[0]?'on':''}' data-t='${x[0]}'>${x[2]}<span>${x[1]}</span></button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>page(b.dataset.t))}function head(t,s,k=''){return `<div class='section'>${k?`<div class='kicker'>${k}</div>`:''}<h1 class='title'>${t}</h1><p class='sub'>${s}</p></div>`}
function render(){tabs();let v={home,workout,active:activeScreen,exercises,progressScreen,nutrition,share};$('screen').innerHTML=(v[P]||home)();setTimeout(bind)}
function home(){let d=done(),a=active(),w=d.filter(s=>new Date(s.start)>new Date(Date.now()-7*864e5)),v=w.reduce((x,s)=>x+vol(s),0),r=R[0];return `<section class='card hero'><div><h1 class='title'>Good morning,<br>${S.name}.</h1><p class='sub'>Same discipline. Stronger you.</p></div><img src='assets/galaw-logo.svg' alt='Galaw logo'></section>${a?`<section class='card section'><div class='row'><div><div class='label'>Active workout</div><h2 style='margin:7px 0 5px'>${a.name}</h2><p class='muted' style='margin:0'>${sets(a)} sets • ${kg(vol(a))} KG</p></div><button class='btn success small' onclick="page('active')">Resume</button></div></section>`:''}<section class='card section'><div class='row'><div><div class='label'>Today’s routine</div><div class='value' style='margin-top:8px'>${r.name}</div></div><div class='muted'>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div></div><p class='muted'>${r.ex.length} exercises • ~${r.min} min • ${r.desc}</p><div class='tiles'>${r.ex.slice(0,3).map(x=>`<div class='tile'>${eicon()}<span>${x[0]}</span></div>`).join('')}<div class='tile'><b style='font-size:24px'>+${Math.max(0,r.ex.length-3)}</b><span>more</span></div></div><button class='btn primary' onclick="startW('push')">${I.play} Start Workout</button></section><section class='grid3 section'><div class='card stat'><div class='label'>Weekly Volume</div><div class='value'>${kg(v)}</div><div class='green'>from logs</div></div><div class='card stat'><div class='label'>Streak</div><div class='value'>${Math.min(d.length,7)}</div><div class='muted'>Days</div></div><div class='card stat'><div class='label'>This Week</div><div class='value'>${w.length}/4</div><div class='muted'>Workouts</div></div></section><section class='card section'><div class='row'><div class='label'>Recent Load</div><div class='label'>Volume</div></div><div class='chart'>${[2.9,3.4,5.8,0,4.1,0,0].map((n,i)=>`<div class='barwrap'><div class='bar ${i===2?'on':''}' style='--h:${Math.max(8,n*18)}px'>${n?`<b>${n}K</b>`:''}</div><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></section>`}
function workout(){let a=active(),list=R.filter(r=>F==='All'||r.focus===F);return `${head('Routines','Build consistency with clean, reusable workout plans.')}${a?`<section class='card section'><div class='row'><div><div class='label'>Workout in progress</div><h2 style='margin:7px 0 5px'>${a.name}</h2><p class='muted' style='margin:0'>${sets(a)} sets • ${progress(a)}% progress</p></div><button class='btn success small' onclick="page('active')">Continue</button></div></section>`:''}<div class='chips section'>${['All','Upper Body','Lower Body','Full Body'].map(x=>`<button class='chip ${F===x?'on':''}' data-f='${x}'>${x}</button>`).join('')}</div><section class='stack'>${list.map(r=>`<div class='card routine'><div class='thumb'>${eicon()}</div><div><div class='row'><h2 style='margin:0;font-size:25px'>${r.name}</h2><button class='btn ghost iconbtn' onclick="preview('${r.id}')">${I.arr}</button></div><p class='muted' style='margin:5px 0'>${r.desc}</p><div class='meta'><span>${I.dumb} ${r.ex.length} exercises</span><span>${I.chart} ~${r.min} min</span></div><button class='btn success small' onclick="startW('${r.id}')">${I.play} Start</button></div></div>`).join('')}</section>`}
function preview(rid){let r=R.find(x=>x.id===rid);toast(`${r.name}: ${r.ex.map(e=>e[0]).join(', ')}`,true)}function startW(rid){if(active())return modal('Resume or replace?','You already have an active workout. Continue it or replace it with this routine.',()=>{S.active=null;createW(rid)});createW(rid)}function createW(rid){let r=R.find(x=>x.id===rid);let s={id:id(),rid:r.id,name:r.name,desc:r.desc,start:new Date().toISOString(),end:null,done:false,ex:r.ex.map((x,i)=>({id:id(),name:x[0],muscle:x[1],eq:x[2],ts:x[3],tr:x[4],kg:x[5],order:i+1,open:i===0,sets:[]}))};S.sessions.push(s);S.active=s.id;save();P='active';render();toast('Workout started.',true)}
function activeScreen(){let s=active();if(!s)return `${head('Active Workout','No active workout yet. Choose a routine to begin.')}<section class='card section'><button class='btn success' onclick="page('workout')">Choose Routine</button></section>`;return `<section class='card'><div class='kicker'>Active workout</div><h1 class='title'>${s.name}</h1><p class='sub'>${s.ex.length} exercises • ${s.desc}</p><div style='margin-top:14px'><div class='row'><div class='label'>Workout Progress</div><b>${comp(s)} / ${s.ex.length} exercises</b></div><div class='barline' style='margin-top:10px'><span style='width:${progress(s)}%'></span></div></div><div class='grid3 section'><div class='flat'><div class='label'>Sets</div><div class='value' style='font-size:25px'>${sets(s)}</div></div><div class='flat'><div class='label'>Volume</div><div class='value' style='font-size:25px'>${kg(vol(s))}</div></div><div class='flat'><div class='label'>Time</div><div class='value' style='font-size:25px'>${dur(s)}</div></div></div></section><section class='stack section'>${s.ex.map(exCard).join('')}</section><section class='card section'><div class='row'><div><div class='label'>Rest guide</div><h3 style='margin:7px 0 5px'>${rest(s)} seconds</h3><p class='muted' style='margin:0'>Keep your next set controlled and clean.</p></div><div class='value green'>${sets(s)}</div></div></section><section class='stack section'><button class='btn success' onclick='tryFinish()'>${I.flag} Finish Workout</button><button class='btn remove' onclick='cancelW()'>Cancel Workout</button></section>`}
function exCard(e){let last=e.sets[e.sets.length-1],nk=last?last.kg:e.kg,nr=last?last.reps:e.tr;return `<article class='card'><div class='exhead'><div class='exicon'>${eicon()}</div><div><h2 style='margin:0;font-size:24px'>${e.order}. ${e.name}</h2><p class='muted' style='margin:5px 0 0'>${e.muscle} • ${e.eq} • Target ${e.ts}×${e.tr}</p></div><button class='btn ghost iconbtn' onclick="toggleEx('${e.id}')">${e.open?'−':'+'}</button></div>${e.open?`<div class='sethead'><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>${e.sets.length?e.sets.map((t,i)=>`<div class='setrow'><div class='cell'>${i+1}</div><div class='cell'>${kg(t.kg)} KG</div><div class='cell'>${t.reps}</div><button class='delete' onclick="removeSet('${e.id}','${t.id}')">${I.trash}</button></div>`).join(''):`<div class='empty'>No sets yet. Add your first set below.</div>`}<div class='inputrow'><div class='inputbox'><label>Weight KG</label><input class='field' id='kg-${e.id}' type='number' inputmode='decimal' min='0' max='500' step='0.5' value='${nk}'></div><div class='inputbox'><label>Reps</label><input class='field' id='reps-${e.id}' type='number' inputmode='numeric' min='1' max='100' step='1' value='${nr}'></div><button class='check' onclick="addSet('${e.id}')">${I.check}</button></div><p class='help'>Valid range: 0–500 KG and 1–100 reps. Maximum 12 sets per exercise.</p>`:''}</article>`}
function rest(s){return s.ex.some(e=>e.sets.some(t=>Number(t.kg)>=80))?90:60}function getEx(eid){let s=active();return s?s.ex.find(e=>e.id===eid):null}function toggleEx(eid){let s=active();s.ex.forEach(e=>e.open=e.id===eid?!e.open:false);save();render()}function valid(v,min,max,n,int=false){let x=Number(v);if(v===''||Number.isNaN(x))throw Error(`${n} is required.`);if(x<min||x>max)throw Error(`${n} must be between ${min} and ${max}.`);if(int&&!Number.isInteger(x))throw Error(`${n} must be a whole number.`);return x}function addSet(eid){let e=getEx(eid);if(!e)return;if(e.sets.length>=12)return toast('Maximum 12 sets per exercise only.');try{let k=valid($('kg-'+eid).value,0,500,'Weight'),r=valid($('reps-'+eid).value,1,100,'Reps',true),s=active();e.sets.push({id:id(),kg:k,reps:r,at:new Date().toISOString()});let idx=s.ex.findIndex(x=>x.id===eid);if(e.sets.length>=e.ts&&s.ex[idx+1]){s.ex.forEach(x=>x.open=false);s.ex[idx+1].open=true}else e.open=true;save();render();toast('Set saved.',true)}catch(err){toast(err.message)}}function removeSet(eid,sid){let e=getEx(eid);e.sets=e.sets.filter(x=>x.id!==sid);e.open=true;save();render();toast('Set removed.',true)}function tryFinish(){let s=active();if(!s)return;if(sets(s)===0)return toast('Log at least one set before finishing.');let miss=s.ex.filter(e=>e.sets.length===0).length;if(miss)return modal('Finish workout?',`${miss} exercise(s) have no logged sets. You can finish now or go back and complete them.`,finishW);finishW()}function finishW(){let s=active();s.done=true;s.end=new Date().toISOString();S.active=null;last=s.id;save();P='share';render();toast('Workout completed.',true)}function cancelW(){let s=active();modal('Cancel workout?','This removes the active workout and all logged sets in this session.',()=>{S.sessions=S.sessions.filter(x=>x.id!==s.id);S.active=null;save();P='workout';render();toast('Workout cancelled.',true)})}
function exercises(){let names=Object.keys(G),g=G[SG]||G[names[0]];return `${head('Exercise Guide','Clear steps, mistakes, and safety reminders for proper form.')}<section class='section'><input class='search' id='es' placeholder='Search exercise...'><div class='chips section'>${names.map(n=>`<button class='chip ${SG===n?'on':''}' data-g='${n}'>${n}</button>`).join('')}</div></section><section class='card section'><div class='row'><div><div class='label'>${g.m} • ${g.eq}</div><h1 style='margin:8px 0 0;font-size:34px'>${SG}</h1></div><div class='exicon'>${eicon()}</div></div><h3>Correct form</h3><ol>${g.s.map(x=>`<li>${x}</li>`).join('')}</ol><h3>Common mistakes</h3><ul>${g.x.map(x=>`<li>${x}</li>`).join('')}</ul><div class='flat'><b class='green'>Safety tip:</b> <span class='muted'>${g.t}</span></div></section>`}
function progressScreen(){let d=done(),v=d.reduce((a,s)=>a+vol(s),0),st=d.reduce((a,s)=>a+sets(s),0),td=new Set(d.map(s=>new Date(s.start).getDate())),ch=d.slice(0,7).reverse();return `${head('Progress','Review history, volume, consistency, and personal bests.')}<section class='grid3 section'><div class='card stat'><div class='label'>Workouts</div><div class='value'>${d.length}</div></div><div class='card stat'><div class='label'>Sets</div><div class='value'>${st}</div></div><div class='card stat'><div class='label'>Volume</div><div class='value'>${kg(v)}</div></div></section><section class='card section'><div class='label'>Recent Load</div>${ch.length?`<div class='chart'>${ch.map((s,i)=>{let m=Math.max(...ch.map(x=>vol(x)),1),h=Math.max(8,Math.round(vol(s)/m*110));return `<div class='barwrap'><div class='bar ${i===ch.length-1?'on':''}' style='--h:${h}px'><b>${kg(vol(s))}</b></div><span>${s.name.split(' ')[0]}</span></div>`}).join('')}</div>`:`<div class='empty'>Finish a workout to generate your chart.</div>`}</section><section class='card section'><div class='label'>Workout Calendar</div><div class='calendar'>${Array.from({length:30},(_,i)=>`<div class='day ${td.has(i+1)?'done':''}'>${i+1}</div>`).join('')}</div></section><section class='card section'><div class='label'>Recent Sessions</div>${d.length?d.slice(0,5).map(s=>`<div class='flat section'><div class='row'><div><b>${s.name}</b><p class='muted' style='margin:5px 0 0'>${sets(s)} sets • ${dur(s)} • ${kg(vol(s))} KG</p></div><button class='btn ghost small' onclick="openShare('${s.id}')">View</button></div></div>`).join(''):`<div class='empty'>No completed sessions yet.</div>`}</section>`}
function nutrition(){let today=new Date().toISOString().slice(0,10),m=S.meals.filter(x=>x.date===today),t=m.reduce((a,x)=>{a.c+=+x.cal;a.p+=+x.p;a.car+=+x.car;a.f+=+x.f;return a},{c:0,p:0,car:0,f:0});return `${head('Nutrition','Simple meal logging with estimated daily macros.')}<section class='card section'><div class='label'>Today</div><div class='value'>${t.c}</div><p class='muted'>estimated kcal</p><div class='macro'><div class='flat'><b>${t.p}g</b><br><span class='muted'>Protein</span></div><div class='flat'><b>${t.car}g</b><br><span class='muted'>Carbs</span></div><div class='flat'><b>${t.f}g</b><br><span class='muted'>Fats</span></div></div></section><section class='card section'><div class='label'>Add Meal</div><div class='stack section'><input id='mn' class='search' placeholder='Food name'><div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'><input id='mcals' class='search' type='number' placeholder='Calories'><select id='mtpe' class='search'><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class='macro'><input id='mp' class='search' type='number' placeholder='Protein'><input id='mcar' class='search' type='number' placeholder='Carbs'><input id='mf' class='search' type='number' placeholder='Fats'></div><button class='btn success' onclick='addMeal()'>${I.plus} Add Meal</button><p class='help'>Nutrition values are estimates. Food scan can be integrated after deployment.</p></div></section><section class='card section'><div class='label'>Meals Logged</div>${m.length?m.map(x=>`<div class='flat section'><div class='row'><div><b>${x.type} • ${x.name}</b><p class='muted' style='margin:5px 0 0'>${x.cal} kcal • P ${x.p}g • C ${x.car}g • F ${x.f}g</p></div><button class='delete' onclick="removeMeal('${x.id}')">${I.trash}</button></div></div>`).join(''):`<div class='empty'>No meals logged today.</div>`}</section>`}function addMeal(){try{let n=$('mn').value.trim();if(n.length<2)throw Error('Food name is required.');let c=valid($('mcals').value,0,5000,'Calories',true),p=valid($('mp').value||0,0,500,'Protein'),car=valid($('mcar').value||0,0,500,'Carbs'),f=valid($('mf').value||0,0,500,'Fats');S.meals.push({id:id(),date:new Date().toISOString().slice(0,10),type:$('mtpe').value,name:n,cal:c,p,car,f});save();render();toast('Meal saved.',true)}catch(e){toast(e.message)}}function removeMeal(i){S.meals=S.meals.filter(x=>x.id!==i);save();render();toast('Meal removed.',true)}
function openShare(i){last=i;P='share';render()}function share(){let s=S.sessions.find(x=>x.id===last)||done()[0];if(!s)return `${head('Workout Summary','No completed workout selected.')}<section class='card section'><button class='btn success' onclick="page('workout')">Start Workout</button></section>`;return `${head('Workout Complete','Save or share your Galaw workout summary.')}<section class='card section'><div class='row'><div class='brand'><img class='logo' src='assets/galaw-logo.svg' alt='Galaw logo'><div><div class='label'>Galaw Summary</div><h2 style='margin:5px 0 0;font-size:30px'>${s.name}</h2></div></div></div><div class='sharestats'><div class='flat'><div class='label'>Duration</div><b>${dur(s)}</b></div><div class='flat'><div class='label'>Exercises</div><b>${comp(s)} / ${s.ex.length}</b></div><div class='flat'><div class='label'>Sets</div><b>${sets(s)}</b></div><div class='flat'><div class='label'>Volume</div><b>${kg(vol(s))} KG</b></div></div><div class='flat'><b class='green'>Completed</b><p class='muted' style='margin:6px 0 0'>${s.ex.map(e=>`${e.name} (${e.sets.length} sets)`).join(' • ')}</p></div><button class='btn success section' onclick="shareW('${s.id}')">Share Workout</button><button class='btn ghost' onclick="page('home')">Back to Home</button></section>`}function shareW(i){let s=S.sessions.find(x=>x.id===i),txt=`Galaw Workout Complete\n${s.name}\n${dur(s)} • ${sets(s)} sets • ${kg(vol(s))} KG volume`;if(navigator.share)navigator.share({title:'Galaw Workout',text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Workout summary copied.',true));else toast(txt,true)}
function bind(){document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F=b.dataset.f;render()});document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{SG=b.dataset.g;render()});let es=$('es');if(es)es.oninput=()=>{let q=es.value.toLowerCase(),m=Object.keys(G).find(n=>n.toLowerCase().includes(q));if(m){SG=m;render()}}}addEventListener('online',()=>{$('net').textContent='Online'});addEventListener('offline',()=>{$('net').textContent='Offline ready'});$('net').textContent=navigator.onLine?'Online':'Offline ready';render();
</script>
</body>
</html>
